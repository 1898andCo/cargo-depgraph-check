[package]
name = "cargo-depgraph-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["1898 & Co. <engineering@1898andco.com>"]
description = "Cargo subcommand to enforce workspace crate dependency graph rules via allowlist configuration"
license = "MIT"
repository = "https://github.com/1898andCo/cargo-depgraph-check"
readme = "README.md"
keywords = ["cargo-subcommand", "dependency-graph", "workspace", "linter", "architecture"]
categories = ["development-tools::cargo-plugins"]
exclude = [
    "tests/**/*",
    ".github/**/*",
]

[[bin]]
name = "cargo-depgraph-check"
path = "src/main.rs"

[dependencies]
cargo_metadata = "0.19"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
insta = "1"
assert_cmd = "2"
predicates = "3"

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"
disabled-strategies = ["compile"]
