name: Validate Codeowners
on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-codeowners:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Harden the runner (Block egress)
      uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
      with:
        egress-policy: block
        allowed-endpoints: >
          github.com:443

    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    # Pinned to SHA — upstream issue #173 still open but workaround in place (split steps)
    - uses: step-security/codeowners-validator@073378e2c16714d69ac00356acebdb7505d82c7e # v0.7.4
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      name: "Full check of CODEOWNERS"
      with:
        checks: "syntax,duppatterns"
        github_access_token: "${{ secrets.GITHUB_TOKEN }}"
    # Pinned to SHA — upstream issue #173 still open but workaround in place (split steps)
    - uses: step-security/codeowners-validator@073378e2c16714d69ac00356acebdb7505d82c7e # v0.7.4
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
      name: "Syntax check of CODEOWNERS"
      with:
        checks: "syntax,duppatterns"
